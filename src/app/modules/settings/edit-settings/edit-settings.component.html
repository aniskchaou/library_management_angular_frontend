<div class="modal-header">
  <h5 class="modal-title">
    <mat-icon class="ll-section-icon" style="vertical-align:middle;">settings</mat-icon>
    {{ 'settings.editTitle' | translate }}
  </h5>
  <button type="button" class="btn-close" aria-label="Close" (click)="closeModal()"></button>
</div>
<div class="modal-body">
  <form #form="ngForm" class="ll-form ll-form--grid">
    <mat-form-field appearance="outline" class="ll-form__field">
      <mat-label>{{ 'ui.name' | translate }}</mat-label>
      <input matInput name="name" [(ngModel)]="model.name" maxlength="99" required />
    </mat-form-field>

    <mat-form-field appearance="outline" class="ll-form__field">
      <mat-label>{{ 'settings.colTelephone' | translate }}</mat-label>
      <input matInput name="telephone" [(ngModel)]="model.telephone" maxlength="99" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="ll-form__field">
      <mat-label>{{ 'ui.address' | translate }}</mat-label>
      <input matInput name="address" [(ngModel)]="model.address" maxlength="99" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="ll-form__field">
      <mat-label>{{ 'settings.colFax' | translate }}</mat-label>
      <input matInput name="fax" [(ngModel)]="model.fax" maxlength="99" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="ll-form__field ll-form__field--full">
      <mat-label>{{ 'settings.colLanguage' | translate }}</mat-label>
      <mat-select name="lang" [(ngModel)]="model.lang">
        <mat-option value="EN">English</mat-option>
        <mat-option value="AR">عربى</mat-option>
        <mat-option value="HN">हिन्दी</mat-option>
        <mat-option value="BN">বাংলা</mat-option>
      </mat-select>
    </mat-form-field>
  </form>
</div>
<div class="modal-footer">
  <button mat-stroked-button type="button" (click)="closeModal()">
    <mat-icon>close</mat-icon> Cancel
  </button>
  <button mat-flat-button color="primary" type="button" (click)="edit()" [disabled]="!form?.valid">
    <mat-icon>save</mat-icon> {{ 'ui.save' | translate }}
  </button>
</div>
