<div class="ll-form-wrap">
  <h3 class="ll-section-title">
    <mat-icon class="ll-section-icon">account_balance_wallet</mat-icon> PayPal Settings
  </h3>
  <p class="ll-section-sub">Configure the PayPal credentials used to process payments.</p>

  <form [formGroup]="paypalForm" (ngSubmit)="onSubmit()" class="ll-form">
    <mat-form-field appearance="outline" class="ll-form__field">
      <mat-label>Client ID</mat-label>
      <input matInput formControlName="clientId" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="ll-form__field">
      <mat-label>Client Secret</mat-label>
      <input matInput formControlName="clientSecret" type="password" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="ll-form__field">
      <mat-label>Mode</mat-label>
      <mat-select formControlName="mode">
        <mat-option value="sandbox">Sandbox</mat-option>
        <mat-option value="live">Live</mat-option>
      </mat-select>
    </mat-form-field>

    <div class="ll-form__actions">
      <button mat-flat-button color="primary" type="submit" [disabled]="!paypalForm.valid">
        <mat-icon>save</mat-icon> Update
      </button>
    </div>
  </form>

  @if (successMessage) {
    <div class="ll-alert ll-alert--ok">{{ successMessage }}</div>
  }
</div>
