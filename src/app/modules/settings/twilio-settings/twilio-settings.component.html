<div class="ll-form-wrap">
  <h3 class="ll-section-title">
    <mat-icon class="ll-section-icon">sms</mat-icon> Twilio Settings
  </h3>
  <p class="ll-section-sub">Configure your Twilio account credentials used for SMS notifications.</p>

  <form [formGroup]="twilioForm" (ngSubmit)="onSubmit()" class="ll-form">
    <mat-form-field appearance="outline" class="ll-form__field">
      <mat-label>Account SID</mat-label>
      <input matInput formControlName="accountSid" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="ll-form__field">
      <mat-label>Auth Token</mat-label>
      <input matInput formControlName="authToken" type="password" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="ll-form__field">
      <mat-label>Phone Number</mat-label>
      <input matInput formControlName="phoneNumber" />
    </mat-form-field>

    <div class="ll-form__actions">
      <button mat-flat-button color="primary" type="submit" [disabled]="!twilioForm.valid">
        <mat-icon>save</mat-icon> Update
      </button>
    </div>
  </form>

  @if (successMessage) {
    <div class="ll-alert ll-alert--ok">{{ successMessage }}</div>
  }
</div>
