<div class="ll-page">
  @if (loading) {
    <div class="ll-loading"><mat-progress-spinner mode="indeterminate" diameter="48"></mat-progress-spinner></div>
  } @else {
    <mat-card class="ll-page__header" appearance="outlined">
      <mat-card-content class="ll-page__header-content">
        <div class="ll-page__title">
          <mat-icon class="ll-page__icon">email</mat-icon>
          <div>
            <h2>{{ 'settings.emailTitle' | translate }}</h2>
            <p class="ll-page__subtitle">SMTP and email delivery configuration.</p>
          </div>
        </div>
      </mat-card-content>
    </mat-card>

    <mat-card class="ll-page__body" appearance="outlined">
      <mat-card-content>
        <app-settings-email-list
          (idEvent)="edit($event)"
          [settings]="settings$"
          [settingsI18n]="settingsI18n">
        </app-settings-email-list>
        <app-settings-modal [settingsI18n]="settingsI18n" [id]="id"></app-settings-modal>
      </mat-card-content>
    </mat-card>
  }
</div>
