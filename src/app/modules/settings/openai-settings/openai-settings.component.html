<div class="ll-form-wrap">
  <h3 class="ll-section-title">
    <mat-icon class="ll-section-icon">smart_toy</mat-icon> OpenAI API Settings
  </h3>
  <p class="ll-section-sub">Manage the API key used by the OpenAI integration.</p>

  <form [formGroup]="openaiForm" (ngSubmit)="onSubmit()" class="ll-form">
    <mat-form-field appearance="outline" class="ll-form__field">
      <mat-label>API Key</mat-label>
      <input matInput formControlName="apiKey" type="password" />
    </mat-form-field>

    <div class="ll-form__actions">
      <button mat-flat-button color="primary" type="submit" [disabled]="!openaiForm.valid">
        <mat-icon>save</mat-icon> Update
      </button>
    </div>
  </form>

  @if (successMessage) {
    <div class="ll-alert ll-alert--ok">{{ successMessage }}</div>
  }
</div>
