<div class="container-fluid">
  <!-- Page Heading -->
  <div class="page-heading mb-4">
    <h1 class="h3 mb-2 text-gray-800">
      <i class="fas fa-trash-alt"></i> {{ 'book.destroyedTitle' | translate }}
    </h1>
    <p class="mb-4">This module displays all the destroyed books and allows you to manage them efficiently.</p>
  </div>

  @if (loading) {
    <div>
      <app-loading></app-loading>
    </div>
  } @else {
    <app-statistics-book
      [bookI18n]="bookI18n"
      (result)="filter($event)"
    ></app-statistics-book>
    <!-- DataTables Example -->
    <div class="card mb-4">
      <div class="card-body">
        <div class="table-responsive">
          <app-destroyed-books-list
            (idEvent)="edit($event)"
            (viewEvent)="view($event)"
            (deleteEvent)="delete($event)"
            [books]="books$"
            [bookI18n]="bookI18n"
          ></app-destroyed-books-list>
          <app-modal-book [bookI18n]="bookI18n" [id]="id"></app-modal-book>
        </div>
      </div>
    </div>
  }

</div>
