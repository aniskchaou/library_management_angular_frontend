<div class="ll-modal">
  <div class="ll-modal__header">
    <mat-icon class="ll-modal__icon">edit</mat-icon>
    <h2 class="ll-modal__title">{{ category?.id ? 'Edit' : 'Add' }} Category</h2>
    <button mat-icon-button class="ll-modal__close" (click)="onCancelClick()" aria-label="Close">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="ll-modal__content">
    @if (category) {
      <form #categoryForm="ngForm" novalidate class="ll-form">
        <div class="ll-form__grid">
          <mat-form-field appearance="outline" class="ll-form__full">
            <mat-label>Category Name</mat-label>
            <input matInput type="text" [(ngModel)]="category.category_name" name="categoryName"
                   placeholder="e.g. Electronics, Apparel" maxlength="99" required #categoryName="ngModel" />
            @if (categoryName.invalid && (categoryName.dirty || categoryName.touched)) {
              <mat-error>Category Name is required.</mat-error>
            }
          </mat-form-field>

          <mat-form-field appearance="outline" class="ll-form__full">
            <mat-label>Slug</mat-label>
            <input matInput type="text" [(ngModel)]="category.slug" name="slug" maxlength="99" placeholder="e.g. fiction-category" />
          </mat-form-field>

          <mat-checkbox [(ngModel)]="category.published" name="published" class="ll-form__full">Published</mat-checkbox>
        </div>

        <div class="ll-modal__actions">
          <button mat-stroked-button type="button" (click)="onCancelClick()">Cancel</button>
          <button mat-flat-button color="primary" type="button" (click)="saveCategory()" [disabled]="categoryForm.invalid">
            <mat-icon>save</mat-icon> Save Changes
          </button>
        </div>
      </form>
    } @else {
      <div class="ll-modal__loading">
        <mat-progress-spinner mode="indeterminate" diameter="40"></mat-progress-spinner>
      </div>
    }
  </div>
</div>
