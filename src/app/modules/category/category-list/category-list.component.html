<div>
  <input
    type="text"
    class="form-control"
    placeholder="Search by name..."
    (input)="updateFilter($event)"
  />
</div>

<ngx-datatable
  class="bootstrap"
  [rows]="categories"
  [columnMode]="'force'"
  [headerHeight]="50"
  [footerHeight]="50"
  [rowHeight]="'auto'"
  [limit]="10"
  [loadingIndicator]="loadingIndicator"
  [reorderable]="reorderable"
  (select)="onSelect($event)"
  (activate)="onActivate($event)"
>

<ngx-datatable-column name="Thumbnail">
  <ng-template ngx-datatable-cell-template let-row="row">
    <!-- Generate random background color -->
    <div [style.background-color]="getRandomColor()" 
         style="width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; border-radius: 50%; color: white; font-weight: bold;">
      {{ row.category_name ? row.category_name.charAt(0).toUpperCase() : '' }}
    </div>
  </ng-template>
</ngx-datatable-column>

  <!-- Category Name -->
  <ngx-datatable-column name="{{ categoryI18n?.category_nameI18n }}" [prop]="'category_name'">
    <ng-template ngx-datatable-cell-template let-row="row">
      <b>{{ row.category_name | titlecapital }}</b>
    </ng-template>
  </ngx-datatable-column>

  <!-- Slug -->
  <ngx-datatable-column name="Slug" [prop]="'slug'">
    <ng-template ngx-datatable-cell-template let-row="row">
      {{ row.slug }}
    </ng-template>
  </ngx-datatable-column>

  <!-- Published -->
  <ngx-datatable-column name="Published" [prop]="'published'">
    <ng-template ngx-datatable-cell-template let-row="row">
      <div class="slide-button" [ngClass]="{'active': row.published}" (click)="toggle(row.id, row.published)">
        <div class="slider"></div>
      </div>
    </ng-template>
  </ngx-datatable-column>

  <!-- Items -->
  <ngx-datatable-column name="Items">
    <ng-template ngx-datatable-cell-template let-row="row">
      N/A
    </ng-template>
  </ngx-datatable-column>

  <!-- Actions -->
  <ngx-datatable-column name="Actions">
    <ng-template ngx-datatable-cell-template let-row="row">
     <!--  <div class="dropdown action-buttons high-zindex-dropdown">
        <button class="btn btn-secondary btn-sm dropdown-toggle" type="button" id="dropdownMenuButton" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
          Actions
        </button>
        <div class="dropdown-menu" aria-labelledby="dropdownMenuButton">
          <a class="dropdown-item"  (click)="editRow(row)">
            <i class="fas fa-edit"></i> Edit
          </a>
          <a class="dropdown-item"  (click)="deleteRow(row.id)">
            <i class="fas fa-trash-alt"></i> Delete
          </a>
        </div>
      </div> -->
      <button type="button" class="btn btn-outline-secondary btn-sm" (click)="openViewDialog(row)">
        <i class="fas fa-eye"></i>  View
      </button>
 
    </ng-template>
  </ngx-datatable-column>
  

</ngx-datatable>
