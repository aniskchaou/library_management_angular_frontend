<div class="ll-stats">
  <div class="ll-stats__toolbar">
    <button mat-flat-button color="primary" (click)="openAddDialog()">
      <mat-icon>add</mat-icon> {{ 'ui.add' | translate }}
    </button>
    <button mat-stroked-button (click)="showChart()">
      <mat-icon>insights</mat-icon> {{ 'nav.analytics' | translate }}
    </button>
    <button mat-stroked-button (click)="reloadPage()">
      <mat-icon>refresh</mat-icon> {{ 'ui.reload' | translate }}
    </button>
  </div>

  <div class="ll-stats__kpis">
    <mat-card appearance="outlined" class="ll-kpi ll-kpi--indigo">
      <mat-card-content>
        <div class="ll-kpi__top">
          <span class="ll-kpi__label">Total Categories</span>
          <mat-icon>category</mat-icon>
        </div>
        <div class="ll-kpi__value">{{ count ?? '—' }}</div>
        <mat-progress-bar mode="determinate" [value]="100"></mat-progress-bar>
      </mat-card-content>
    </mat-card>

    <mat-card appearance="outlined" class="ll-kpi ll-kpi--ok">
      <mat-card-content>
        <div class="ll-kpi__top">
          <span class="ll-kpi__label">Published</span>
          <mat-icon>check_circle</mat-icon>
        </div>
        <div class="ll-kpi__value">{{ status?.published ?? '—' }}</div>
        <mat-progress-bar mode="determinate" [value]="(count && status?.published) ? (status.published / count) * 100 : 0"></mat-progress-bar>
      </mat-card-content>
    </mat-card>

    <mat-card appearance="outlined" class="ll-kpi ll-kpi--danger">
      <mat-card-content>
        <div class="ll-kpi__top">
          <span class="ll-kpi__label">Unpublished</span>
          <mat-icon>cancel</mat-icon>
        </div>
        <div class="ll-kpi__value">{{ status?.unpublished ?? '—' }}</div>
        <mat-progress-bar mode="determinate" [value]="(count && status?.unpublished) ? (status.unpublished / count) * 100 : 0"></mat-progress-bar>
      </mat-card-content>
    </mat-card>
  </div>

  @if (showsummary) {
    <mat-card appearance="outlined">
      <mat-card-content>
        <div class="ll-charts__title"><mat-icon>bar_chart</mat-icon> Books by Category</div>
        <ngx-charts-bar-vertical
          [view]="view"
          [scheme]="colorScheme"
          [results]="data"
          [gradient]="gradient"
          [xAxis]="showXAxis"
          [yAxis]="showYAxis"
          [legend]="showLegend"
          [showXAxisLabel]="showXAxisLabel"
          [showYAxisLabel]="showYAxisLabel"
          [xAxisLabel]="xAxisLabel"
          [yAxisLabel]="yAxisLabel"
          (select)="onSelect($event)">
        </ngx-charts-bar-vertical>
      </mat-card-content>
    </mat-card>
  }
</div>
