<div class="ll-page">
  <mat-card class="ll-page__header" appearance="outlined">
    <mat-card-content class="ll-page__header-content">
      <mat-icon class="ll-page__icon">assignment_return</mat-icon>
      <div class="ll-page__title">
        <h1>{{ 'circulation.returnedTitle' | translate }}</h1>
        <p>{{ 'circulation.returnedDesc' | translate }}</p>
      </div>
    </mat-card-content>
  </mat-card>
  <mat-card class="ll-page__body" appearance="outlined">
    <mat-card-content>
      @if (loading) {
        <div class="ll-loading">
          <mat-progress-spinner diameter="48" mode="indeterminate"></mat-progress-spinner>
        </div>
      } @else {
        <app-circulation-list
          (editEvent)="edit($event)"
          (viewEvent)="view($event)"
          (deleteEvent)="delete($event)"
          [circulations]="circulations$"
          [circulationI18n]="circulationI18n"
        ></app-circulation-list>
      }
    </mat-card-content>
  </mat-card>
</div>
