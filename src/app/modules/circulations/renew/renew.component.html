<!-- Modal Header -->
<div class="modal-header">
  <h5 class="modal-title" id="renewalModalLabel"><i class="fas fa-refresh"></i> Renewal</h5>
  <button type="button" class="close"(click)="closeModal()" aria-label="Close">
    <span aria-hidden="true">&times;</span>
  </button>
</div>

<!-- Modal Body -->
<div class="modal-body">
  <form [formGroup]="renewalForm" style="background-color: white; padding: 20px; border-radius: 5px;">
    
    <!-- Member Selection -->
    <div class="form-group">
      <label for="member">Member:</label>
      <i class="fas fa-info-circle" data-toggle="tooltip" 
         title="Description: Select the member who is renewing the item."></i>
      <ng-select class="form-control" id="member" name="member"
                 [items]="members$"
                 bindLabel="firstname" bindValue="id"
                 formControlName="member"
                 placeholder="Select a member"
                 [loading]="loading">
      </ng-select>
    </div>

    <!-- Item Barcode -->
    <div class="form-group">
      <label for="itemBarcode">Item Barcode:</label>
      <i class="fas fa-info-circle" data-toggle="tooltip" 
         title="Description: Select the barcode of the item you wish to renew."></i>
      <ng-select class="form-control" id="itemBarcode" name="itemBarcode"
                 [items]="books$"
                 bindLabel="title" bindValue="id"
                 formControlName="itemBarcode"
                 placeholder="Select a barcode"
                 [loading]="loading">
      </ng-select>
    </div>

    <!-- Renewal Due Date -->
    <div class="form-group">
      <label for="renewalDueDate">Renewal Due Date:</label>
      <i class="fas fa-info-circle" data-toggle="tooltip" 
         title="Description: Enter the due date for the renewed item."></i>
      <input type="date" class="form-control" id="renewalDueDate" name="renewalDueDate" formControlName="renewalDueDate">
    </div>

    <!-- Forgive Fines on Return -->
    <div class="form-group">
      <label>Forgive fines on return:</label>
      <i class="fas fa-info-circle" data-toggle="tooltip" 
         title="Description: Choose whether to forgive any fines incurred by the member on returning this item."></i>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="forgiveFines" id="forgiveFinesYes" value="yes" formControlName="forgiveFines">
        <label class="form-check-label" for="forgiveFinesYes">Yes</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="forgiveFines" id="forgiveFinesNo" value="no" formControlName="forgiveFines">
        <label class="form-check-label" for="forgiveFinesNo">No</label>
      </div>
    </div>

  </form>
</div>

<!-- Modal Footer -->
<div class="modal-footer">
  <button type="button" class="btn btn-outline-secondary" (click)="closeModal()">Close</button>
  <button type="button" class="btn btn-outline-primary" (click)="renew()">Renew</button>
</div>
