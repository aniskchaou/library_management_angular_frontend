<div class="ll-page">
  <mat-card class="ll-page__header" appearance="outlined">
    <mat-card-content class="ll-page__header-content">
      <mat-icon class="ll-page__icon">calendar_month</mat-icon>
      <div class="ll-page__title">
        <h1>{{ 'circulation.calendarTitle' | translate }}</h1>
        <p>View and manage circulation events on your calendar.</p>
      </div>
    </mat-card-content>
  </mat-card>
  <mat-card class="ll-page__body" appearance="outlined">
    <mat-card-content style="min-height: 600px;">
      <ngx-event-calendar
        [showAddButton]="false"
        [language]="'en'"
        [dataSource]="dataArray"
        (dayEvents)="selectDay($event)"
        (newEvent)="addEvent($event)"
      ></ngx-event-calendar>
    </mat-card-content>
  </mat-card>
</div>
