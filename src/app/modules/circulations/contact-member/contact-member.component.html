@if (sending) {
  <div>
    <app-loading></app-loading>
  </div>
} @else {
  <form
    class="form-group odd"
    id="category_name_field_box"
    [formGroup]="contactForm"
    >

    <!-- Notification type toggle -->
    <div class="mb-3">
      <label class="d-block mb-1"><strong>Send via</strong></label>
      <div class="btn-group" role="group">
        <button type="button" class="btn"
          [class.btn-primary]="notificationType === 'email'"
          [class.btn-outline-primary]="notificationType !== 'email'"
          (click)="notificationType = 'email'">
          <i class="fas fa-envelope"></i> Email
        </button>
        <button type="button" class="btn"
          [class.btn-warning]="notificationType === 'sms'"
          [class.btn-outline-warning]="notificationType !== 'sms'"
          (click)="notificationType = 'sms'">
          <i class="fas fa-sms"></i> SMS
        </button>
      </div>
      @if (notificationType === 'sms') {
        <div class="mt-2">
          <small class="text-muted">Sending to mobile: <strong>{{ mobile || '(not set)' }}</strong></small>
        </div>
      } @else {
        <div class="mt-2">
          <small class="text-muted">Sending to email: <strong>{{ email || '(not set)' }}</strong></small>
        </div>
      }
    </div>

    <label
      class="col-sm-3 control-label"
      for="name"
      id="payment_name_display_as_box"
      >
      <font style="vertical-align: inherit">
        <font style="vertical-align: inherit">
          {{ 'circulation.colMessage' | translate }}
        </font> </font
        ><span class="required">
        <font style="vertical-align: inherit">
          <font style="vertical-align: inherit">*</font>
        </font>
      </span>
    </label>
    <div class="col-sm-9 col-md-6 col-lg-6" id="payment_name_input_box">
      <textarea
        formControlName="body"
        id="field-payment_name"
        name="body"
        class="form-control"
        type="text"
        rows="5"
        maxlength="500"
      ></textarea>
      <small class="text-muted">{{ contactForm.get('body').value?.length || 0 }} / 500</small>
    </div>
    <br />
    <button (click)="add()" type="button" class="btn"
      [class.btn-info]="notificationType === 'email'"
      [class.btn-warning]="notificationType === 'sms'">
      <i class="fas" [class.fa-envelope]="notificationType === 'email'" [class.fa-sms]="notificationType === 'sms'"></i>
      {{ notificationType === 'sms' ? 'Send SMS' : ('circulation.sendEmail' | translate) }}
    </button>
  </form>
}
