<table class="table table-bordered" id="table" width="100%" cellspacing="0">
  <thead>
    <tr>
      <th>{{ 'category.colName' | translate }}</th>
    </tr>
  </thead>
  <tfoot>
    <tr>
      <th>{{ 'category.colName' | translate }}</th>
    </tr>
  </tfoot>
  <tbody>
    @for (c of categories; track c) {
      <tr>
        <td>{{ c.category_name }}</td>
      </tr>
    }
  </tbody>
</table>
