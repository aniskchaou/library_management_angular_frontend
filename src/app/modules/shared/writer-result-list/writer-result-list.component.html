<table class="table table-bordered" id="table" width="100%" cellspacing="0">
  <thead>
    <tr>
      <th>{{ 'writer.colName' | translate }}</th>
    </tr>
  </thead>
  <tfoot>
    <tr>
      <th>{{ 'writer.colName' | translate }}</th>
    </tr>
  </tfoot>
  <tbody>
    @for (t of writers; track t) {
      <tr>
        <td>{{ t.name }}</td>
      </tr>
    }
  </tbody>
</table>
