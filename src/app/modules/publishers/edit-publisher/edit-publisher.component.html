<div class="ll-modal ll-modal--wide">
  <div class="ll-modal__header">
    <mat-icon class="ll-modal__icon">edit</mat-icon>
    <h2 class="ll-modal__title">Edit Publisher</h2>
    <button mat-icon-button class="ll-modal__close" (click)="onCancelClick()" aria-label="Close">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="ll-modal__content">
    @if (publisher) {
      <form #publisherForm="ngForm" novalidate class="ll-form">
        <div class="ll-form__grid">
          <mat-form-field appearance="outline">
            <mat-label>Publisher Name</mat-label>
            <input matInput type="text" [(ngModel)]="publisher.name" name="name" required #nameRef="ngModel" maxlength="99" />
            @if (nameRef.invalid && (nameRef.dirty || nameRef.touched)) {
              <mat-error>Publisher Name is required.</mat-error>
            }
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Address</mat-label>
            <input matInput type="text" [(ngModel)]="publisher.address" name="address" />
            <mat-icon matSuffix>place</mat-icon>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Email</mat-label>
            <input matInput type="email" [(ngModel)]="publisher.email" name="email" />
            <mat-icon matSuffix>mail</mat-icon>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Phone</mat-label>
            <input matInput type="tel" [(ngModel)]="publisher.phone" name="phone" />
            <mat-icon matSuffix>call</mat-icon>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Country</mat-label>
            <mat-select [(ngModel)]="publisher.country" name="country">
              @for (c of countries; track c) {
                <mat-option [value]="c">{{ c }}</mat-option>
              }
            </mat-select>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Website</mat-label>
            <input matInput type="url" [(ngModel)]="publisher.website" name="website" />
            <mat-icon matSuffix>language</mat-icon>
          </mat-form-field>
        </div>

        <div class="ll-modal__actions">
          <button mat-stroked-button type="button" (click)="onCancelClick()">Cancel</button>
          <button mat-flat-button color="primary" type="button" (click)="savePublisher()" [disabled]="publisherForm.invalid">
            <mat-icon>save</mat-icon> Save Changes
          </button>
        </div>
      </form>
    } @else {
      <div class="ll-modal__loading">
        <mat-progress-spinner mode="indeterminate" diameter="40"></mat-progress-spinner>
      </div>
    }
  </div>
</div>
