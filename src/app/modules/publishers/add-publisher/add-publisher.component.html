<div class="ll-modal ll-modal--wide">
  <div class="ll-modal__header">
    <mat-icon class="ll-modal__icon">add_business</mat-icon>
    <h2 class="ll-modal__title">{{ 'publisher.addTitle' | translate }}</h2>
    <button mat-icon-button class="ll-modal__close" (click)="closeModal()" aria-label="Close">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="ll-modal__content">
    <form [formGroup]="publisherForm" novalidate class="ll-form">
      <div class="ll-form__grid">
        <mat-form-field appearance="outline">
          <mat-label>Publisher Name</mat-label>
          <input matInput type="text" formControlName="name" maxlength="99" placeholder="e.g. Penguin Publishing" />
          @if (submitted && f.name?.errors?.required) {
            <mat-error>Publisher Name is required.</mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Address</mat-label>
          <input matInput id="addressInput" type="text" formControlName="address" placeholder="e.g. 123 Publishing Street" />
          <mat-icon matSuffix>place</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" placeholder="contact@publisher.com" />
          <mat-icon matSuffix>mail</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Phone</mat-label>
          <input matInput type="tel" formControlName="phone" placeholder="+1 555 123 4567" />
          <mat-icon matSuffix>call</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Country</mat-label>
          <mat-select formControlName="country">
            @for (c of countries; track c.code) {
              <mat-option [value]="c.code">{{ c.name }}</mat-option>
            }
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Website</mat-label>
          <input matInput type="url" formControlName="website" placeholder="https://example.com" />
          <mat-icon matSuffix>language</mat-icon>
        </mat-form-field>
      </div>

      <div class="ll-modal__actions">
        <button mat-stroked-button type="button" (click)="closeModal()">Cancel</button>
        <button mat-stroked-button type="button" (click)="reset()">
          <mat-icon>restart_alt</mat-icon> Reset
        </button>
        <button mat-flat-button color="primary" type="button" (click)="add()">
          <mat-icon>save</mat-icon> {{ 'ui.save' | translate }}
        </button>
      </div>
    </form>
  </div>
</div>
