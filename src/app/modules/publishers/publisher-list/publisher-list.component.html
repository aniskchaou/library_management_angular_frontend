<div class="ll-list">
  <div class="ll-list__toolbar">
    <mat-form-field appearance="outline" class="ll-list__search">
      <mat-label>Search publishers…</mat-label>
      <input matInput type="text" placeholder="Name, email, country…" />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
  </div>

  <ngx-datatable
    class="bootstrap ll-list__table"
    [rows]="publishers"
    [columnMode]="'force'"
    [headerHeight]="50"
    [footerHeight]="50"
    [rowHeight]="'auto'"
    [limit]="10"
    [loadingIndicator]="loading"
    [reorderable]="reorderable"
    (select)="onSelect($event)"
    (activate)="onActivate($event)">

    <ngx-datatable-column name="" [width]="70" [sortable]="false">
      <ng-template ngx-datatable-cell-template let-row="row">
        <div class="ll-avatar">
          {{ row.name ? row.name.charAt(0).toUpperCase() : '?' }}
        </div>
      </ng-template>
    </ngx-datatable-column>

    <ngx-datatable-column name="{{ 'publisher.colName' | translate }}" [prop]="'name'">
      <ng-template ngx-datatable-cell-template let-row="row">
        <div class="ll-cell--stack">
          <span class="ll-cell--strong">{{ row.name }}</span>
          @if (row.country) {
            <span class="ll-cell--muted">{{ row.country }}</span>
          }
        </div>
      </ng-template>
    </ngx-datatable-column>

    <ngx-datatable-column name="Email" [prop]="'email'">
      <ng-template ngx-datatable-cell-template let-row="row">
        @if (row.email) {
          <a [href]="'mailto:' + row.email" class="ll-cell--link">{{ row.email }}</a>
        } @else {
          <span class="ll-cell--muted">—</span>
        }
      </ng-template>
    </ngx-datatable-column>

    <ngx-datatable-column name="Phone" [prop]="'phone'" [width]="140">
      <ng-template ngx-datatable-cell-template let-row="row">
        <span>{{ row.phone || '—' }}</span>
      </ng-template>
    </ngx-datatable-column>

    <ngx-datatable-column name="Address" [prop]="'address'">
      <ng-template ngx-datatable-cell-template let-row="row">
        <span class="ll-cell--muted">{{ row.address || '—' }}</span>
      </ng-template>
    </ngx-datatable-column>

    <ngx-datatable-column name="Website" [prop]="'website'" [width]="120">
      <ng-template ngx-datatable-cell-template let-row="row">
        @if (row.website) {
          <a [href]="row.website" target="_blank" rel="noopener" class="ll-cell--link">
            <mat-icon class="ll-cell__icon">open_in_new</mat-icon> Visit
          </a>
        } @else {
          <span class="ll-cell--muted">—</span>
        }
      </ng-template>
    </ngx-datatable-column>

    <ngx-datatable-column name="Actions" [width]="120" [sortable]="false">
      <ng-template ngx-datatable-cell-template let-row="row">
        <button mat-icon-button [matMenuTriggerFor]="actions" matTooltip="Actions">
          <mat-icon>more_vert</mat-icon>
        </button>
        <mat-menu #actions="matMenu">
          <button mat-menu-item (click)="openViewDialog(row)">
            <mat-icon>visibility</mat-icon><span>View</span>
          </button>
          <button mat-menu-item (click)="openEditDialog(row)">
            <mat-icon>edit</mat-icon><span>Edit</span>
          </button>
          <mat-divider></mat-divider>
          <button mat-menu-item class="ll-menu--danger" (click)="delete(row.id)">
            <mat-icon>delete</mat-icon><span>Delete</span>
          </button>
        </mat-menu>
      </ng-template>
    </ngx-datatable-column>
  </ngx-datatable>
</div>
