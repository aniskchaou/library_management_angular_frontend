<ngx-datatable
  class="bootstrap"
  [rows]="publishers"
  [columnMode]="'force'"
  [headerHeight]="50"
  [footerHeight]="50"
  [rowHeight]="'auto'"
  [limit]="10"
  [loadingIndicator]="loading"
  [reorderable]="reorderable"
  (select)="onSelect($event)"
  (activate)="onActivate($event)"
>

  <!-- ID Column -->
  <ngx-datatable-column name="ID" [prop]="'id'">
    <ng-template ngx-datatable-cell-template let-row="row">
      {{ row.id }}
    </ng-template>
  </ngx-datatable-column>

  <!-- Publisher Name Column -->
  <ngx-datatable-column name="Publisher Name" [prop]="'name'">
    <ng-template ngx-datatable-cell-template let-row="row">
      {{ row.name }}
    </ng-template>
  </ngx-datatable-column>

  <!-- Address Column -->
  <ngx-datatable-column name="Address" [prop]="'address'">
    <ng-template ngx-datatable-cell-template let-row="row">
      {{ row.address }}
    </ng-template>
  </ngx-datatable-column>

  <!-- Email Column -->
  <ngx-datatable-column name="Email" [prop]="'email'">
    <ng-template ngx-datatable-cell-template let-row="row">
      {{ row.email }}
    </ng-template>
  </ngx-datatable-column>

  <!-- Phone Column -->
  <ngx-datatable-column name="Phone" [prop]="'phone'">
    <ng-template ngx-datatable-cell-template let-row="row">
      {{ row.phone }}
    </ng-template>
  </ngx-datatable-column>

  <!-- Country Column -->
  <ngx-datatable-column name="Country" [prop]="'country'">
    <ng-template ngx-datatable-cell-template let-row="row">
      {{ row.country }}
    </ng-template>
  </ngx-datatable-column>

  <!-- Website Column -->
  <ngx-datatable-column name="Website" [prop]="'website'">
    <ng-template ngx-datatable-cell-template let-row="row">
      <a [href]="row.website" target="_blank">{{ row.website }}</a>
    </ng-template>
  </ngx-datatable-column>

  <!-- Actions Column -->
  <ngx-datatable-column name="Actions">
    <ng-template ngx-datatable-cell-template let-row="row">
      <button class="btn btn-sm btn-outline-primary mr-2" (click)="openEditDialog(row)">
        Edit
      </button>
     <!--  <button class="btn btn-sm btn-danger" (click)="deleteRow(row)">
        Delete
      </button> -->
    </ng-template>
  </ngx-datatable-column>

</ngx-datatable>
