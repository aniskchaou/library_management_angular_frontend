<table class="table table-bordered" id="table" width="100%" cellspacing="0">
  <thead>
    <tr>
      <th>{{ incomeI18n.nameI18n }}</th>
      <th>{{ incomeI18n.dateI18n }}</th>
      <th>{{ incomeI18n.amountI18n }}</th>
      <th></th>
    </tr>
  </thead>
  <tfoot>
    <tr>
      <th>{{ incomeI18n.nameI18n }}</th>
      <th>{{ incomeI18n.dateI18n }}</th>
      <th>{{ incomeI18n.amountI18n }}</th>
      <th></th>
    </tr>
  </tfoot>
  @if (incomes.length > 0) {
    <tbody>
      @for (c of incomes; track c) {
        <tr>
          <td>{{ c.name }}</td>
          <td>{{ c.date }}</td>
          <td>{{ c.amount }}</td>
          <td>
            <button
              type="button"
              data-toggle="modal"
              (click)="edit(c.id)"
              data-target="#edit"
              class="btn btn-warning btn-sm"
              >
              <i class="fas fa-edit"></i>
            </button>
            <button
              type="button"
              class="btn btn-danger btn-sm"
              (click)="delete(c.id)"
              >
              <i class="fas fa-trash-alt"></i>
            </button>
          </td>
        </tr>
      }
    </tbody>
  }
</table>
