<div class="ll-modal">
  <div class="ll-modal__header">
    <mat-icon class="ll-modal__icon">upload_file</mat-icon>
    <h2 class="ll-modal__title">Upload Document</h2>
    <button mat-icon-button class="ll-modal__close" (click)="closeModal()" aria-label="Close">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="ll-modal__content">
    <form [formGroup]="uploadForm" (ngSubmit)="onSubmit()" enctype="multipart/form-data" class="ll-form">
      <p class="ll-form__hint">Upload a document for <strong>{{ member?.firstname }} {{ member?.surname }}</strong></p>
      <div class="ll-upload">
        <input type="file" id="memberFile" formControlName="file" (change)="onFileChange($event)" class="ll-upload__input" />
        <label for="memberFile" class="ll-upload__label">
          <mat-icon>cloud_upload</mat-icon>
          <span>{{ fileToUpload?.name || 'Choose a file...' }}</span>
        </label>
      </div>
      <div class="ll-modal__actions">
        <button mat-stroked-button type="button" (click)="closeModal()">Cancel</button>
        <button mat-flat-button color="primary" type="submit" [disabled]="!fileToUpload">
          <mat-icon>upload</mat-icon> Upload
        </button>
      </div>
    </form>
  </div>
</div>
