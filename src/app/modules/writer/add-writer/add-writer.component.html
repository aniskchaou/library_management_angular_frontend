<div class="ll-modal ll-modal--wide">
  <div class="ll-modal__header">
    <mat-icon class="ll-modal__icon">person_add</mat-icon>
    <h2 class="ll-modal__title">{{ 'writer.addTitle' | translate }}</h2>
    <button mat-icon-button class="ll-modal__close" (click)="closeModal()" aria-label="Close">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="ll-modal__content">
    <form [formGroup]="writerForm" novalidate class="ll-form">
      <div class="ll-form__grid">
        <mat-form-field appearance="outline">
          <mat-label>Name</mat-label>
          <input matInput type="text" formControlName="name" maxlength="99" placeholder="e.g. Jane Austen" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Note / Nickname</mat-label>
          <input matInput type="text" formControlName="note" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Date of Birth</mat-label>
          <input matInput type="date" formControlName="dob" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="ll-form__col-span">
          <mat-label>Deceased?</mat-label>
          <mat-select formControlName="died">
            <mat-option value="no">Living</mat-option>
            <mat-option value="yes">Deceased</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Date of Death</mat-label>
          <input matInput type="date" formControlName="dod" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="ll-form__col-full">
          <mat-label>Biography</mat-label>
          <textarea matInput rows="3" formControlName="bio" placeholder="Short biography…"></textarea>
        </mat-form-field>

        <mat-form-field appearance="outline" class="ll-form__col-full">
          <mat-label>Publications</mat-label>
          <textarea matInput rows="2" formControlName="publications" placeholder="Comma-separated list of major works"></textarea>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Awards</mat-label>
          <input matInput type="text" formControlName="awards" placeholder="Nobel Prize, Booker…" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>References</mat-label>
          <input matInput type="text" formControlName="refrences" placeholder="External references / URLs" />
        </mat-form-field>
      </div>

      <div class="ll-modal__actions">
        <button mat-stroked-button type="button" (click)="closeModal()">Cancel</button>
        <button mat-stroked-button type="button" (click)="reset()">
          <mat-icon>restart_alt</mat-icon> Reset
        </button>
        <button mat-flat-button color="primary" type="button" (click)="add()">
          <mat-icon>save</mat-icon> {{ 'ui.save' | translate }}
        </button>
      </div>
    </form>
  </div>
</div>
