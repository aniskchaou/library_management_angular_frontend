<div class="ll-list">
  <div class="ll-list__toolbar">
    <mat-form-field appearance="outline" class="ll-list__search">
      <mat-label>Search writers…</mat-label>
      <input matInput type="text" placeholder="Name, awards, references…" />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
  </div>

  <ngx-datatable
    class="bootstrap ll-list__table"
    [rows]="writers"
    [columnMode]="'force'"
    [headerHeight]="50"
    [footerHeight]="50"
    [rowHeight]="'auto'"
    [limit]="10"
    [loadingIndicator]="loading"
    [reorderable]="reorderable"
    (select)="onSelect($event)"
    (activate)="onActivate($event)">

    <ngx-datatable-column name="" [width]="70" [sortable]="false">
      <ng-template ngx-datatable-cell-template let-row="row">
        <div class="ll-avatar">
          {{ row.name ? row.name.charAt(0).toUpperCase() : '?' }}
        </div>
      </ng-template>
    </ngx-datatable-column>

    <ngx-datatable-column name="{{ 'writer.colName' | translate }}" [prop]="'name'">
      <ng-template ngx-datatable-cell-template let-row="row">
        <div class="ll-cell--stack">
          <span class="ll-cell--strong">{{ row.name }}</span>
          @if (row.note) {
            <span class="ll-cell--muted">{{ row.note }}</span>
          }
        </div>
      </ng-template>
    </ngx-datatable-column>

    <ngx-datatable-column name="Date of Birth" [prop]="'dob'" [width]="140">
      <ng-template ngx-datatable-cell-template let-row="row">
        <span>{{ row.dob || '—' }}</span>
      </ng-template>
    </ngx-datatable-column>

    <ngx-datatable-column name="Status" [prop]="'died'" [width]="120">
      <ng-template ngx-datatable-cell-template let-row="row">
        @if (row.died) {
          <mat-chip class="ll-chip--off">
            <mat-icon matChipAvatar>history_toggle_off</mat-icon> Deceased
          </mat-chip>
        } @else {
          <mat-chip class="ll-chip--ok">
            <mat-icon matChipAvatar>check_circle</mat-icon> Living
          </mat-chip>
        }
      </ng-template>
    </ngx-datatable-column>

    <ngx-datatable-column name="Awards" [prop]="'awards'">
      <ng-template ngx-datatable-cell-template let-row="row">
        <span class="ll-cell--muted">{{ row.awards || '—' }}</span>
      </ng-template>
    </ngx-datatable-column>

    <ngx-datatable-column name="Publications" [prop]="'publications'">
      <ng-template ngx-datatable-cell-template let-row="row">
        <span class="ll-cell--muted">{{ row.publications || '—' }}</span>
      </ng-template>
    </ngx-datatable-column>

    <ngx-datatable-column name="Actions" [width]="120" [sortable]="false">
      <ng-template ngx-datatable-cell-template let-row="row">
        <button mat-icon-button [matMenuTriggerFor]="actions" matTooltip="Actions">
          <mat-icon>more_vert</mat-icon>
        </button>
        <mat-menu #actions="matMenu">
          <button mat-menu-item (click)="openViewDialog(row)">
            <mat-icon>visibility</mat-icon><span>View</span>
          </button>
          <button mat-menu-item (click)="openEditDialog(row)">
            <mat-icon>edit</mat-icon><span>Edit</span>
          </button>
          <mat-divider></mat-divider>
          <button mat-menu-item class="ll-menu--danger" (click)="delete(row)">
            <mat-icon>delete</mat-icon><span>Delete</span>
          </button>
        </mat-menu>
      </ng-template>
    </ngx-datatable-column>
  </ngx-datatable>
</div>
