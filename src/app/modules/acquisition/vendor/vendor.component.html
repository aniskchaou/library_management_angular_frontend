<div class="ll-page">
  <mat-card class="ll-page__header" appearance="outlined">
    <mat-card-content class="ll-page__header-content">
      <mat-icon class="ll-page__icon">storefront</mat-icon>
      <div class="ll-page__title">
        <h1>{{ 'acquisition.vendorTitle' | translate }}</h1>
        <p>{{ 'acquisition.vendorDesc' | translate }}</p>
      </div>
      <div class="ll-page__actions">
        <button mat-flat-button color="primary" (click)="openAddDialog()"><mat-icon>add</mat-icon> {{ 'ui.create' | translate }}</button>
        <button mat-stroked-button (click)="loadVendors()"><mat-icon>refresh</mat-icon> {{ 'ui.reload' | translate }}</button>
      </div>
    </mat-card-content>
  </mat-card>
  <mat-card class="ll-page__body" appearance="outlined">
    <mat-card-content>
      @if (loadingIndicator) {
        <div class="ll-loading"><mat-progress-spinner diameter="48" mode="indeterminate"></mat-progress-spinner></div>
      } @else {
        <mat-tab-group animationDuration="200ms" class="ll-tabs">
          <mat-tab>
            <ng-template mat-tab-label><mat-icon class="ll-tab__icon">list</mat-icon> {{ 'ui.list' | translate }}</ng-template>
            <div class="ll-tab__content">
              <ngx-datatable class="material" [rows]="vendors" [columnMode]="'force'" [headerHeight]="50" [footerHeight]="50" [rowHeight]="'auto'" [limit]="10">
                <ngx-datatable-column name="Thumbnail">
                  <ng-template ngx-datatable-cell-template let-row="row">
                    <div [style.background-color]="getRandomColor()" style="width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:white;font-weight:bold;">
                      {{ row.name ? row.name.charAt(0).toUpperCase() : '' }}
                    </div>
                  </ng-template>
                </ngx-datatable-column>
                <ngx-datatable-column name="Name" prop="name"></ngx-datatable-column>
                <ngx-datatable-column name="Address" prop="address"></ngx-datatable-column>
                <ngx-datatable-column name="Phone" prop="phone"></ngx-datatable-column>
                <ngx-datatable-column name="Email" prop="email"></ngx-datatable-column>
                <ngx-datatable-column name="Notes" prop="notes"></ngx-datatable-column>
                <ngx-datatable-column name="Actions">
                  <ng-template let-row="row" ngx-datatable-cell-template>
                    <button mat-icon-button [matMenuTriggerFor]="vendorMenu"><mat-icon>more_vert</mat-icon></button>
                    <mat-menu #vendorMenu="matMenu">
                      <button mat-menu-item (click)="openEditDialog(row)"><mat-icon>edit</mat-icon> {{ 'ui.edit' | translate }}</button>
                      <button mat-menu-item (click)="deleteVendor(row.id)"><mat-icon>delete</mat-icon> {{ 'ui.delete' | translate }}</button>
                    </mat-menu>
                  </ng-template>
                </ngx-datatable-column>
              </ngx-datatable>
            </div>
          </mat-tab>
          <mat-tab>
            <ng-template mat-tab-label><mat-icon class="ll-tab__icon">menu_book</mat-icon> {{ 'ui.userManual' | translate }}</ng-template>
            <div class="ll-tab__content"><div [innerHTML]="markdownContent"></div></div>
          </mat-tab>
        </mat-tab-group>
      }
    </mat-card-content>
  </mat-card>
</div>
