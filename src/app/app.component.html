<!-- Authenticated app shell — Angular Material -->
@if (!isPublicRoute()) {
  <mat-sidenav-container
    class="ll-shell"
    autosize>
    <mat-sidenav #sidenav class="ll-sidenav" mode="side" opened>
      <app-navigation [menuI18n]="menuI18n"></app-navigation>
    </mat-sidenav>
    <mat-sidenav-content class="ll-content">
      <mat-toolbar class="ll-toolbar">
        <button mat-icon-button (click)="sidenav.toggle()" aria-label="Toggle navigation">
          <mat-icon>menu</mat-icon>
        </button>
        <form class="ll-search" (submit)="$event.preventDefault(); search(searchInput.value)">
          <mat-icon class="ll-search__icon">search</mat-icon>
          <input
            #searchInput
            class="ll-search__input"
            type="text"
            placeholder="Search for Books, Authors, Categories, Publishers"
            aria-label="Search" />
            <button mat-flat-button color="primary" type="button" (click)="search(searchInput.value)">
              Search
            </button>
          </form>
          <span class="ll-spacer"></span>
          <app-topbar [menuI18n]="menuI18n"></app-topbar>
        </mat-toolbar>
        <main class="ll-main">
          <router-outlet></router-outlet>
        </main>
        <app-chatbot></app-chatbot>
      </mat-sidenav-content>
    </mat-sidenav-container>
  }


  <!-- Public routes render outside the admin shell (same pattern as login/register) -->
  @if (hasRoute('login')) {
    <app-login (reloadMenu)="reloadMenu()"></app-login>
  }
  @if (hasRoute('register')) {
    <app-register-user (reloadMenu)="reloadMenu()"></app-register-user>
  }
  @if (hasRoute('reset-password')) {
    <app-reset-password (reloadMenu)="reloadMenu()"></app-reset-password>
  }
  @if (hasRoute('forgot-password')) {
    <app-forgot-password (reloadMenu)="reloadMenu()"></app-forgot-password>
  }

  <!-- OPAC / Frontoffice public pages -->
  @if (hasRoute('opac-home')) {
    <app-opac-home></app-opac-home>
  }
  @if (hasRoute('opac')) {
    <app-opac-search></app-opac-search>
  }
  @if (hasRoute('opac-account')) {
    <app-opac-account></app-opac-account>
  }

  <!-- Member portal — separate authenticated shell for library members -->
  @if (hasRoute('member-portal')) {
    <app-member-portal></app-member-portal>
  }
